
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- On reseller domains: fix favicon+title flash using localStorage cache (runs before <title>) -->
    <script>
      (function(){
        var h=window.location.hostname.replace(/^www\./,'');
        if(!h.includes('localhost')&&!h.includes('agendezap')&&!h.includes('vercel')){
          document.querySelectorAll("link[rel~='icon'],link[rel='shortcut icon']").forEach(function(el){el.parentNode.removeChild(el);});
          var l=document.createElement('link');l.rel='icon';l.href='data:,';document.head.appendChild(l);
          var brand=localStorage.getItem('agz_reseller_brand');
          document.title=(brand||'')+(brand?' - Gestão de Agendamentos':'');
        }
      })();
    </script>
    <title>AgendeZap - Gestão de Agendamentos</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f97316">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AgendeZap">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.42.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body class="text-black">
    <div id="root"></div>
<script>
  // Fallback: if nothing rendered after 12s (script failed to load/parse), show the error instead of a blank page
  window.__agzErr = '';
  window.addEventListener('error', function (e) { window.__agzErr = (e && e.message) || String(e); });
  setTimeout(function () {
    var r = document.getElementById('root');
    if (r && !r.children.length) {
      r.innerHTML = '<div style="font-family:sans-serif;text-align:center;padding:40px 24px"><p style="font-weight:900;text-transform:uppercase;font-size:13px">Não foi possível carregar o sistema</p><p style="font-size:12px;color:#94a3b8;margin:12px 0">' + String(window.__agzErr || 'Verifique sua conexão e atualize o navegador.').replace(/</g, '&lt;') + '</p><button onclick="try{navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(x){x.unregister()})});caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}catch(e){};setTimeout(function(){location.reload()},400)" style="padding:10px 20px;background:#000;color:#fff;border:0;border-radius:12px;font-weight:900;font-size:11px;text-transform:uppercase">Limpar cache e recarregar</button></div>';
    }
  }, 12000);
</script>
<script type="module" src="/index.tsx"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        // Check for updates every 2 minutes
        setInterval(() => reg.update(), 2 * 60 * 1000);
      }).catch(() => {});
    });
    // Auto-reload when SW pushes update
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data?.type === 'SW_UPDATED') {
        console.log('[SW] Nova versão detectada, recarregando...');
        window.location.reload();
      }
    });
  }
</script>
</body>
</html>
